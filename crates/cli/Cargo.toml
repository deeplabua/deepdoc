[[bin]]
name = "deepdoc"
path = "src/main.rs"

[dependencies]
deepdoc-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
