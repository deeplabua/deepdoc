[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deeplabua/deepdoc"
homepage = "https://github.com/deeplabua/deepdoc"
authors = ["DeepLab"]

[workspace.dependencies]
deepdoc-core = { version = "0.1.0", path = "crates/core" }

# All dependencies must be permissive (MIT / Apache-2.0 / BSD / MPL / Zlib).
# No GPL/AGPL/commercial-only crates — check the licence before adding one.
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
