[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deeplabua/deepdoc"
homepage = "https://github.com/deeplabua/deepdoc"
authors = ["DeepLab"]

[workspace.dependencies]
deepdoc-core = { version = "0.3.0", path = "crates/core" }
# Optional, behind the `ocr` feature only — never in the default build.
# default-features = false keeps both the model weights and the TLS stack out
# unless the ocr-fetch-models feature asks for them.
deepocr-core = { version = "0.1.0", default-features = false }  # MIT OR Apache-2.0

# All dependencies must be permissive (MIT / Apache-2.0 / BSD / MPL / Zlib).
# No GPL/AGPL/commercial-only crates — check the licence before adding one.
anyhow = "1.0"                                          # MIT OR Apache-2.0
# Spreadsheets. default-features = false keeps the optional date types out.
calamine = { version = "0.36", default-features = false }        # MIT
clap = { version = "4.5", features = ["derive"] }       # MIT OR Apache-2.0
csv = "1.4"                                             # Unlicense OR MIT
html5ever = "0.39"                                      # MIT OR Apache-2.0
markup5ever_rcdom = "0.39"                              # MIT OR Apache-2.0
# PDF. Chosen over raw lopdf because font encodings (CFF, Type1, Identity-H
# CMaps) are the hard half of PDF text extraction and this crate already solves
# them, while its OutputDev trait still hands us positions and font sizes — the
# inputs reading order, columns and heading heuristics need. It re-exports lopdf.
pdf-extract = "0.12"                                    # MIT
pulldown-cmark = { version = "0.13", default-features = false }  # MIT
quick-xml = "0.41"                                      # MIT
# Batch extraction across cores. Pure Rust, no C, work-stealing only.
rayon = "1.11"                                          # MIT OR Apache-2.0
serde = { version = "1.0", features = ["derive"] }      # MIT OR Apache-2.0
serde_json = "1.0"                                      # MIT OR Apache-2.0
# Chunk content hashes. RustCrypto: pure Rust, no C, no `-sys` transitives.
sha2 = "0.10"                                           # MIT OR Apache-2.0
thiserror = "2.0"                                       # MIT OR Apache-2.0
# OOXML/ODF/EPUB containers. Only `deflate` — the other backends (bzip2, lzma,
# zstd) are C bindings, and a zero-C-dependency binary is the whole promise.
zip = { version = "8.6", default-features = false, features = ["deflate"] }  # MIT

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "deeplabua/homebrew-tap"
# Publish jobs to run in CI. `./publish-crates` is the local reusable workflow
# `.github/workflows/publish-crates.yml` (crates.io publish; needs the
# CARGO_REGISTRY_TOKEN repo secret).
publish-jobs = ["homebrew", "./publish-crates"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# No `[workspace.metadata.dist.dependencies]`: DeepDoc has no runtime dependency
# at all — that is the whole promise, and the formula must not add one.
