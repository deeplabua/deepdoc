[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deeplabua/deepdoc"
homepage = "https://github.com/deeplabua/deepdoc"
authors = ["DeepLab"]

[workspace.dependencies]
deepdoc-core = { version = "0.1.0", path = "crates/core" }

# All dependencies must be permissive (MIT / Apache-2.0 / BSD / MPL / Zlib).
# No GPL/AGPL/commercial-only crates — check the licence before adding one.
anyhow = "1.0"                                          # MIT OR Apache-2.0
# Spreadsheets. default-features = false keeps the optional date types out.
calamine = { version = "0.36", default-features = false }        # MIT
clap = { version = "4.5", features = ["derive"] }       # MIT OR Apache-2.0
csv = "1.4"                                             # Unlicense OR MIT
html5ever = "0.39"                                      # MIT OR Apache-2.0
markup5ever_rcdom = "0.39"                              # MIT OR Apache-2.0
# PDF. Chosen over raw lopdf because font encodings (CFF, Type1, Identity-H
# CMaps) are the hard half of PDF text extraction and this crate already solves
# them, while its OutputDev trait still hands us positions and font sizes — the
# inputs reading order, columns and heading heuristics need. It re-exports lopdf.
pdf-extract = "0.12"                                    # MIT
pulldown-cmark = { version = "0.13", default-features = false }  # MIT
quick-xml = "0.41"                                      # MIT
serde = { version = "1.0", features = ["derive"] }      # MIT OR Apache-2.0
serde_json = "1.0"                                      # MIT OR Apache-2.0
thiserror = "2.0"                                       # MIT OR Apache-2.0
# OOXML/ODF/EPUB containers. Only `deflate` — the other backends (bzip2, lzma,
# zstd) are C bindings, and a zero-C-dependency binary is the whole promise.
zip = { version = "8.6", default-features = false, features = ["deflate"] }  # MIT

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
